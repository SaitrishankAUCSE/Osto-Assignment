services:
  auth-cli:
    build: .
    image: auth-cli:latest
    container_name: auth-cli
    stdin_open: true # interactive
    tty: true        # interactive
    volumes:
      - auth_data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=/data/auth.db
      - MAX_LOGIN_ATTEMPTS=5
      - LOCKOUT_DURATION_MINUTES=15
      - SESSION_TIMEOUT_MINUTES=60

volumes:
  auth_data:
